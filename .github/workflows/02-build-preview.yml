name: Build Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install Python dependency
        run: python3 -m pip install --disable-pip-version-check pyyaml
      - name: Install pinned Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: "3.1.11.1"
      - name: Install XeLaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-xetex texlive-latex-extra texlive-fonts-recommended \
            fonts-noto-core
      - name: Build EPUB and PDF
        run: python3 scripts/export-book.py --format all
      - name: Upload preview package
        uses: actions/upload-artifact@v7
        with:
          name: malarkitektur-ai-statlig-myndighet-preview
          path: |
            exports/*.epub
            exports/*.pdf
          if-no-files-found: error
          retention-days: 7
